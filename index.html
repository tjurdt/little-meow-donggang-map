<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>華僑市場店家調查</title>
<style>
  :root{--ink:#0e3b43;--ink2:#12525c;--surface:#eef1f0;--panel:#fff;--line:#d3dbdc;--line-strong:#b7c2c3;
    --text:#1c2b2e;--muted:#5f7377;--accent:#e2603f;--accent-ink:#b5401f;--radius:10px;--tap:46px;font-synthesis:none}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  html,body{margin:0;height:100%}
  body{font-family:"Noto Sans TC",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"PingFang TC","Microsoft JhengHei",sans-serif;
    background:var(--surface);color:var(--text);font-size:15px;line-height:1.45;display:flex;flex-direction:column;height:100dvh;overflow:hidden;overscroll-behavior:none}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:15px}
  input,select{font-family:inherit;font-size:16px;-webkit-user-select:text;user-select:text}

  header{background:var(--ink);color:#eaf3f3;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;display:flex;align-items:center;gap:8px;flex:0 0 auto}
  header h1{font-size:15px;font-weight:600;margin:0;white-space:nowrap}
  header .spacer{flex:1}
  .icnbtn{background:#12525c;border:1px solid #2c6169;color:#eaf3f3;border-radius:8px;height:38px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500}
  .seg{display:inline-flex;border:1px solid #2c6169;border-radius:8px;overflow:hidden}
  .seg button{padding:0 14px;height:38px;background:#0e3b43;color:#cfe6e6;font-weight:600;font-size:14px}
  .seg button.on{background:#eaf3f3;color:var(--ink)}

  .topbar{background:var(--panel);border-bottom:1px solid var(--line);padding:7px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex:0 0 auto}
  .topbar .seg{border-color:var(--line-strong)}
  .topbar .seg button{background:#fff;color:var(--ink)} .topbar .seg button.on{background:var(--ink);color:#fff}
  .topbar .seg.view button.on{background:var(--accent);color:#fff}
  .minibtn{height:38px;border:1px solid var(--line-strong);border-radius:8px;background:#fff;color:var(--ink);padding:0 12px;font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:5px}
  .spacer{flex:1}

  .stagewrap{position:relative;flex:1 1 auto;overflow:hidden;background:#e9edec;touch-action:none;min-height:0}
  #cstage{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
  #cstage canvas{position:absolute;top:0;left:0;width:100%;height:100%;display:block}
  #base{z-index:1} #overlay{z-index:2}

  /* floating controls over map */
  .fab-col{position:absolute;right:10px;bottom:10px;z-index:8;display:flex;flex-direction:column;gap:8px}
  .fab{width:46px;height:46px;border-radius:23px;background:#fff;border:1px solid var(--line-strong);box-shadow:0 2px 8px rgba(0,0,0,.15);
    display:grid;place-items:center;font-size:20px;color:var(--ink)}
  .zoomstack{position:absolute;right:10px;top:10px;z-index:8;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line-strong);border-radius:10px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.12)}
  .zoomstack button{width:44px;height:42px;font-size:20px;color:var(--ink)} .zoomstack button+button{border-top:1px solid var(--line)}

  .selbar{position:absolute;left:10px;right:66px;bottom:10px;z-index:8;background:var(--ink);color:#eaf3f3;border-radius:12px;
    padding:8px 10px;display:none;align-items:center;gap:8px;box-shadow:0 3px 12px rgba(0,0,0,.22)}
  .selbar.on{display:flex}
  .selbar .n{font-weight:700;font-variant-numeric:tabular-nums} .selbar .grow{flex:1}
  .selbar button{border-radius:8px;height:38px;padding:0 12px;font-weight:600;font-size:14px}
  .selbar .assign{background:var(--accent);color:#fff} .selbar .clr{background:#12525c;color:#dfeff0}
  .selbar .erase{background:#fff;color:var(--accent-ink)}

  .targetbar{position:absolute;left:10px;right:10px;top:10px;z-index:8;background:#b5401f;color:#fff;border-radius:12px;
    padding:8px 12px;display:none;align-items:center;gap:8px;box-shadow:0 3px 12px rgba(0,0,0,.22)}
  .targetbar.on{display:flex}
  .targetbar .grow{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .targetbar button{background:#fff;color:var(--accent-ink);border-radius:8px;height:36px;padding:0 12px;font-weight:700}
  .maphint{position:absolute;left:10px;top:10px;z-index:7;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:999px;
    padding:6px 10px;color:var(--muted);font-size:12px;box-shadow:0 2px 7px rgba(0,0,0,.08);pointer-events:none;white-space:nowrap}

  /* collapsible legend between map and list */
  .legendwrap{flex:0 0 auto;background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .legendtoggle{width:100%;height:44px;padding:0 12px;display:flex;align-items:center;gap:9px;color:var(--ink);font-weight:700;text-align:left}
  .legendicon{width:18px;height:18px;border-radius:50%;flex:0 0 auto;background:conic-gradient(#ed7d31 0 25%,#70ad47 0 50%,#2e75b6 0 75%,#9966ff 0);border:2px solid #fff;box-shadow:0 0 0 1px var(--line-strong)}
  .legendtoggle .grow{flex:1}.legendtoggle .layer{font-size:12px;color:var(--muted);font-weight:500}
  .legendchev{font-size:15px;color:var(--muted);transition:transform .18s}.legendwrap.open .legendchev{transform:rotate(180deg)}
  .legendgrid{display:none;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 14px;padding:10px 12px 12px;max-height:22dvh;overflow:auto;-webkit-overflow-scrolling:touch;border-top:1px solid var(--line)}
  .legendwrap.open .legendgrid{display:grid}
  .legenditem{display:flex;align-items:flex-start;gap:8px;min-width:0;font-size:13px;line-height:1.35}
  .legendsw{width:18px;height:18px;border-radius:5px;flex:0 0 auto;border:1px solid rgba(0,0,0,.16)}

  /* bottom shop list */
  .listwrap{flex:0 0 auto;background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;max-height:40dvh;padding-bottom:env(safe-area-inset-bottom)}
  .listwrap.collapsed .listtools,.listwrap.collapsed .shoplist{display:none}
  .listhead{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);min-height:50px}
  .listhead b{font-size:14px} .listhead .cnt{color:var(--muted);font-size:13px}
  .listhead .grow{flex:1}
  .listhead button{height:38px;border:1px solid var(--line-strong);border-radius:7px;background:#fff;color:var(--ink);padding:0 11px;font-size:13px;font-weight:600}
  .listtools{display:flex;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:#fafbfb}
  .listtools input{min-width:0;flex:1;height:42px;border:1px solid var(--line-strong);border-radius:9px;padding:0 11px;background:#fff;color:var(--text);user-select:text;-webkit-user-select:text}
  .listtools button{height:42px;border:1px solid var(--line-strong);border-radius:9px;background:#fff;color:var(--ink);padding:0 13px;font-weight:600}
  .shoplist{overflow:auto;-webkit-overflow-scrolling:touch;padding:4px 8px 10px}
  .shopitem{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:9px;min-height:52px;cursor:pointer;border:1px solid transparent}
  .shopitem:active{background:#eef4f4}
  .shopitem.active{background:#fff5f1;border-color:#efb19f;box-shadow:inset 3px 0 0 var(--accent)}
  .numbadge{flex:0 0 auto;width:26px;height:26px;border-radius:13px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
  .shopitem .dot{width:14px;height:14px;border-radius:4px;flex:0 0 auto;border:1px solid rgba(0,0,0,.15)}
  .shopitem .nm{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .shopitem .meta{font-size:12px;color:var(--muted);white-space:nowrap}
  .shopitem .edit{flex:0 0 auto;width:44px;height:44px;border-radius:8px;display:grid;place-items:center;color:var(--muted);font-size:16px}
  .shoplist .empty{color:var(--muted);font-size:13px;padding:14px 8px}

  /* sheets */
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#fff;border-top:1px solid var(--line-strong);
    box-shadow:0 -6px 24px rgba(0,0,0,.16);padding:16px 16px calc(16px + env(safe-area-inset-bottom));transform:translateY(120%);
    transition:transform .2s;max-width:680px;margin:0 auto;border-radius:16px 16px 0 0;max-height:86dvh;overflow:auto}
  .sheet.open{transform:translateY(0)}
  .sheet h3{margin:0 0 12px;font-size:16px}
  .sheet .fld{margin-bottom:12px}
  .sheet .fld label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
  .sheet select,.sheet input[type=text]{width:100%;padding:11px;border:1px solid var(--line-strong);border-radius:9px;background:#fff}
  .rowflex{display:flex;gap:8px} .rowflex>*{flex:1}
  .btn{background:#fff;color:var(--ink);border:1px solid var(--line-strong);border-radius:9px;padding:11px 14px;min-height:var(--tap);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent-ink)}
  .btn.ghost{background:#f1f4f4}
  .btn:disabled{opacity:.55;cursor:wait}
  .btn.wide{width:100%}
  .btn.sm{padding:8px 12px;min-height:40px;font-size:14px}
  .sh-btns{display:flex;gap:8px;margin-top:8px}
  .chiprow{display:flex;gap:8px;flex-wrap:wrap}
  .catpick button{border:1.5px solid var(--line);border-radius:999px;padding:8px 13px;background:#fff;display:inline-flex;align-items:center;gap:6px;font-weight:600;min-height:42px}
  .catpick button .sw{width:14px;height:14px;border-radius:4px}
  .catpick button.on{border-color:var(--accent);box-shadow:0 0 0 2px rgba(226,96,63,.16)}
  .exportopts{border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden;background:#fafbfb}
  .exportopts h4{font-size:13px;margin:0;padding:10px 12px 5px;color:var(--ink)}
  .exportmode{display:grid;gap:0;padding:0 8px 8px}
  .exportmode label,.exportcheck{display:flex;align-items:flex-start;gap:9px;padding:9px 8px;min-height:44px;border-radius:8px;cursor:pointer}
  .exportmode label:active,.exportcheck:active{background:#edf2f2}
  .exportmode input,.exportcheck input{width:18px;height:18px;margin:1px 0 0;flex:0 0 auto;accent-color:var(--accent)}
  .exportmode b{display:block;font-size:14px}.exportmode small{display:block;color:var(--muted);font-size:12px;font-weight:400;margin-top:1px}
  .exportopacity{border-top:1px solid var(--line);margin:0 8px;padding:11px 8px}
  .exportopacity.hidden{display:none}.exportopacity .ophead{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;font-weight:600}
  .exportopacity output{color:var(--accent-ink);font-variant-numeric:tabular-nums}.exportopacity input{width:100%;margin:10px 0 2px;accent-color:var(--accent)}
  .exportopacity small{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}
  .exportcheck{border-top:1px solid var(--line);margin:0 8px;padding:11px 8px;font-weight:600;font-size:14px}
  .exportcheck.disabled{color:var(--muted)}
  .expgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .expgrid .btn{flex-direction:column;gap:4px;padding:16px} .expgrid .btn .s{font-size:12px;color:var(--muted);font-weight:400}

  .modal-bg{position:fixed;inset:0;background:rgba(14,59,67,.45);z-index:70;display:none;align-items:flex-start;justify-content:center;padding:22px 14px;overflow:auto}
  .modal-bg.open{display:flex}
  .modal{background:#fff;border-radius:14px;max-width:520px;width:100%;padding:18px}
  .modal h2{margin:0 0 6px;font-size:16px}
  .hint{font-size:12px;color:var(--muted);margin:2px 0 12px}
  .catlist{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
  .catrow{display:flex;align-items:center;gap:9px}
  .catrow input[type=color]{width:42px;height:42px;padding:0;border:1px solid var(--line-strong);border-radius:9px;background:none}
  .catrow input[type=color]:disabled{opacity:.58;cursor:not-allowed}
  .catrow input[type=text]{flex:1;padding:9px 10px;border:1px solid var(--line-strong);border-radius:8px}
  .catrow .del{width:40px;height:40px;border:1px solid var(--line);border-radius:8px;background:#fff;color:#b5401f;font-size:17px}
  .catrow .del:disabled{opacity:.35;cursor:not-allowed}
  .cattools{border-top:1px solid var(--line);padding-top:12px;margin-top:4px}.cattools.hidden,.mergebox.hidden{display:none}
  .cattoolbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mergebox{margin-top:10px;padding:11px;background:#f5f8f8;border:1px solid var(--line);border-radius:10px}
  .mergeflow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:end;gap:7px}.mergeflow label{font-size:12px;color:var(--muted)}
  .mergeflow select{display:block;width:100%;margin-top:4px;padding:10px 8px;border:1px solid var(--line-strong);border-radius:8px;background:#fff;min-width:0}
  .mergearrow{padding-bottom:11px;color:var(--muted);font-weight:700}.mergebox .btn{width:100%;margin-top:10px}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
  .backdrop{position:fixed;inset:0;z-index:55;background:transparent;display:none} .backdrop.on{display:block}
  .toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));z-index:100;transform:translate(-50%,20px);opacity:0;
    background:#153f46;color:#fff;border-radius:999px;padding:10px 16px;font-size:13px;font-weight:600;box-shadow:0 4px 18px rgba(0,0,0,.24);pointer-events:none;transition:.18s}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  input[type=file]{display:none}

  @media (max-width:600px){
    header h1{font-size:14px;overflow:hidden;text-overflow:ellipsis}
    .icnbtn{height:42px;padding:0 11px}.topbar{padding:6px 8px;gap:6px;flex-wrap:nowrap;overflow-x:auto}
    .topbar .seg button{height:42px;padding:0 12px}.minibtn{height:42px;padding:0 11px}
    .zoomstack{right:8px;top:8px}.zoomstack button{width:48px;height:48px}.fab-col{right:8px;bottom:8px}.fab{width:50px;height:50px;border-radius:25px}
    .selbar{left:8px;right:66px;bottom:8px;padding:7px 8px}.selbar button{height:42px;padding:0 10px}
    .targetbar{left:8px;right:8px;top:8px}.maphint{left:8px;top:8px;max-width:calc(100% - 78px);overflow:hidden;text-overflow:ellipsis}
    .legendgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px 10px;padding:10px;max-height:22dvh}.legendtoggle{height:46px;padding:0 10px}
    .listwrap{max-height:42dvh}.shopitem .meta{max-width:34vw;overflow:hidden;text-overflow:ellipsis}
    .sheet{padding:15px 14px calc(15px + env(safe-area-inset-bottom));max-height:92dvh}.sh-btns .btn{min-height:48px}
  }
</style>
</head>
<body>
<header>
  <h1>華僑市場店家調查</h1><div class="spacer"></div>
  <button class="icnbtn" id="btnExport">匯出</button>
  <button class="icnbtn" id="btnMenu">⋯</button>
</header>

<div class="topbar">
  <div class="seg" id="modeSeg">
    <button data-m="assign" class="on">框選</button>
    <button data-m="view">移動</button>
  </div>
  <div class="seg view" id="viewSeg">
    <button data-v="plan">規劃</button>
    <button data-v="actual" class="on">實際</button>
  </div>
  <div class="spacer"></div>
  <button class="minibtn" id="btnFit">全覽</button>
</div>

<div class="stagewrap" id="stagewrap">
  <div id="cstage"><canvas id="base"></canvas><canvas id="overlay"></canvas></div>
  <div class="maphint" id="mapHint">點按多選・拖曳框選・雙指移動縮放</div>
  <div class="zoomstack"><button id="zoomIn">＋</button><button id="zoomOut">−</button></div>
  <div class="fab-col"><button class="fab" id="fabSelClear" title="清除選取">⌫</button></div>
  <div class="selbar" id="selbar"><span class="n" id="selN">0</span><span>格</span><span class="grow"></span>
    <button class="clr" id="selClr">取消</button><button class="erase" id="selErase">清除標記</button><button class="assign" id="selAssign">指定</button></div>
  <div class="targetbar" id="targetbar"><span class="grow" id="targetName"></span>
    <span style="font-size:13px;opacity:.9">點格加入/移除</span><button id="targetDone">完成</button></div>
</div>

<div class="legendwrap" id="legendWrap">
  <button class="legendtoggle" id="legendToggle" aria-expanded="false"><span class="legendicon" aria-hidden="true"></span>
    <span id="legendTitle">圖例</span><span class="grow"></span><span class="layer" id="legendLayer">實際</span><span class="legendchev">⌄</span></button>
  <div class="legendgrid" id="legendGrid"></div>
</div>

<div class="listwrap" id="listWrap">
  <div class="listhead"><b>店家清單</b><span class="cnt" id="shopCnt">0</span><span class="grow"></span>
    <button id="btnListToggle" aria-expanded="true">收合</button></div>
  <div class="listtools"><input id="shopSearch" type="search" placeholder="搜尋店家或分類" autocomplete="off">
    <button id="btnCats">管理分類</button></div>
  <div class="shoplist" id="shopList"></div>
</div>

<!-- assign sheet -->
<div class="sheet" id="assignSheet">
  <h3 id="assignTitle">指定分類與店家</h3>
  <div class="fld"><label>分類</label><select id="asgCat"></select></div>
  <div class="fld"><label>店家名稱（留空會自動命名）</label>
    <div class="rowflex"><input id="asgShop" type="text" list="shopNames" placeholder="輸入店名,或選既有" style="flex:3">
      <button class="btn ghost sm" id="asgDitto" style="flex:1">同上</button></div>
    <datalist id="shopNames"></datalist>
  </div>
  <div class="fld"><label>或沿用既有店家</label><select id="asgExisting"><option value="">選擇既有店家…</option></select></div>
  <div class="sh-btns"><button class="btn ghost" id="asgCancel" style="flex:1">取消</button><button class="btn primary" id="asgApply" style="flex:2">套用</button></div>
</div>

<!-- cell detail sheet -->
<div class="sheet" id="cellSheet">
  <h3>格 <span id="cellCo"></span></h3>
  <div class="fld"><label>規劃分區</label><div class="catpick chiprow" id="cellZone"></div></div>
  <div class="fld"><label>實際分類</label><div class="catpick chiprow" id="cellCat"></div></div>
  <div class="fld"><label>店家</label><input id="cellShop" type="text" list="shopNames" placeholder="留空會自動命名"></div>
  <div class="sh-btns"><button class="btn ghost sm" id="cellClear" style="flex:1">清除此格</button>
    <button class="btn ghost sm" id="cellCancel" style="flex:1">取消</button><button class="btn primary sm" id="cellSave" style="flex:1">儲存</button></div>
</div>

<!-- shop edit sheet -->
<div class="sheet" id="shopSheet">
  <h3>編輯店家</h3>
  <div class="fld"><label>店名</label><input id="shName" type="text"></div>
  <div class="fld"><label>分類</label><select id="shCat"></select></div>
  <div class="sh-btns"><button class="btn ghost sm" id="shDelete" style="flex:1;color:#b5401f">刪除店家</button>
    <button class="btn ghost sm" id="shCancel" style="flex:1">取消</button><button class="btn primary sm" id="shSave" style="flex:1">儲存</button></div>
</div>

<!-- export sheet -->
<div class="sheet" id="expSheet">
  <h3>匯出地圖</h3>
  <p class="hint">圖例會一併匯出。同一店家的編號依地圖位置排序，分散在多處時會重複顯示同一編號。</p>
  <div class="exportopts">
    <h4>匯出內容</h4>
    <div class="exportmode">
      <label><input type="radio" name="expMode" value="plan"><span><b>底圖（原先規劃）</b><small>只顯示規劃分區與牆壁，不含店家清單</small></span></label>
      <label><input type="radio" name="expMode" value="overlay" checked><span><b>實際疊上底圖</b><small>實際調查結果覆蓋於原先規劃</small></span></label>
      <label><input type="radio" name="expMode" value="actual"><span><b>只有實際</b><small>只顯示實際調查結果與牆壁</small></span></label>
    </div>
    <div class="exportopacity" id="expBaseOpacityWrap">
      <div class="ophead"><label for="expBaseOpacity" id="expBaseOpacityTitle">底圖透明度</label><output id="expBaseOpacityValue">90%</output></div>
      <input type="range" id="expBaseOpacity" min="0" max="100" step="5" value="90">
      <small><span>0% 完全透明</span><span>100% 完全不透明</span></small>
    </div>
    <div class="exportopacity" id="expActualOpacityWrap">
      <div class="ophead"><label for="fillA">實際標記透明度</label><output id="fillAValue">80%</output></div>
      <input type="range" id="fillA" min="20" max="95" value="80">

    const oz=state.zones.find(z=>z.id==="z9"),oc=state.cats.find(c=>c.id==="c9");if(oz)oz.color="#D9DEE0";if(oc)oc.color="#D9DEE0";
    state.taxonomyVersion=TAXONOMY_VERSION;save();return;
  }
  const aliases=[
    ["熟食","熟食區"],["蔬果肉品","蔬果肉品區"],["漁特產冷飲","魚特產冷飲","魚特產與冷飲區"],
    ["黃區","拖網魚類現撈區"],["粉區","蝦拖網魚類現撈區"],["上方紫帶","魚類分切零售區"],
    ["下方棕攤","生食區"],["青綠區","東港區漁會展售門市部"],["設施","走道/結構","其他"],["牆/外框","牆壁"]
  ];
  const colors=Object.fromEntries(DEFAULT_CATS.map(c=>[c.color.toUpperCase(),c.id])), catMap={};
  (Array.isArray(state.cats)?state.cats:[]).forEach(c=>{
    const normalized=String(c.name||"").replace(/\s/g,"");
    const index=aliases.findIndex(group=>group.some(n=>n.replace(/\s/g,"")===normalized));
    catMap[c.id]=index>=0?"c"+(index+1):(colors[String(c.color||"").toUpperCase()]||"c9");
  });
  (Array.isArray(state.shops)?state.shops:[]).forEach(sh=>{sh.cat=catMap[sh.cat]||(/^c(?:[1-9]|10)$/.test(sh.cat||"")?sh.cat:"c9");});
  const shopCats=Object.fromEntries((state.shops||[]).map(sh=>[sh.id,sh.cat]));
  for(const k in state.cells){ const d=state.cells[k];
    const canonical=DEFAULT_PLAN_CELLS[k]?.plan;
    if(["zw","zf","zs"].includes(canonical))d.plan="zw";
    else if(d.plan==="zf"||d.plan==="zs")d.plan="zw";
    else if(d.plan&&!/^(?:z[1-9]|zw)$/.test(d.plan))d.plan="z9";
    if(d.cat)d.cat=catMap[d.cat]||(/^c(?:[1-9]|10)$/.test(d.cat)?d.cat:"c9");
    else if(d.shop&&shopCats[d.shop])d.cat=shopCats[d.shop];
  }
  state.zones=clone(DEFAULT_ZONES); state.cats=clone(DEFAULT_CATS); state.taxonomyVersion=TAXONOMY_VERSION; save();
}
function enforceFixedWalls(){ let changed=false,wallZone=state.zones.find(z=>z.id==="zw"),wallCat=state.cats.find(c=>c.id==="c10");
  if(!wallZone){wallZone=clone(DEFAULT_ZONES[9]);state.zones.push(wallZone);changed=true;} if(wallZone.color!=="#3B3838"){wallZone.color="#3B3838";changed=true;}
  if(!wallCat){wallCat=clone(DEFAULT_CATS[9]);state.cats.push(wallCat);changed=true;} if(wallCat.color!=="#3B3838"){wallCat.color="#3B3838";changed=true;}
  const otherZone=state.zones.find(z=>z.id==="z9"),otherCat=state.cats.find(c=>c.id==="c9");if(otherZone&&otherZone.color!=="#D9DEE0"){otherZone.color="#D9DEE0";changed=true;}if(otherCat&&otherCat.color!=="#D9DEE0"){otherCat.color="#D9DEE0";changed=true;}
  for(const k in DEFAULT_PLAN_CELLS){if(!isFixedWall(k))continue;const cur=state.cells[k]||{};if(cur.plan!=="zw"||cur.cat||cur.shop)changed=true;cur.plan="zw";delete cur.cat;delete cur.shop;state.cells[k]=cur;}
  if(changed)save(); }
function nextUnnamedName(catId){ const base="未命名"+(catById(catId)?.name||"區域"); let n=1;
  while(state.shops.some(sh=>sh.name===base+n))n++; return base+n; }
function createUnnamedShop(catId){ const sh={id:uid("s"),name:nextUnnamedName(catId),cat:catId}; state.shops.push(sh); return sh; }
function ensureNamedRegions(){
  const known=new Set(state.shops.map(sh=>sh.id)); for(const k in state.cells)if(state.cells[k].shop&&!known.has(state.cells[k].shop))delete state.cells[k].shop;
  state.shops.forEach(sh=>{if(!String(sh.name||"").trim())sh.name=nextUnnamedName(sh.cat);});
  const pending=new Set(Object.keys(state.cells).filter(k=>state.cells[k].cat&&!state.cells[k].shop)); let made=0;
  while(pending.size){ const first=pending.values().next().value,catId=state.cells[first].cat,q=[first],region=[]; pending.delete(first);
    while(q.length){ const k=q.pop(),[r,c]=keyRC(k); region.push(k);
      [[r-1,c],[r+1,c],[r,c-1],[r,c+1]].forEach(([nr,nc])=>{const nk=nr+"_"+nc;if(pending.has(nk)&&state.cells[nk].cat===catId){pending.delete(nk);q.push(nk);}}); }
    const sh=createUnnamedShop(catId); region.forEach(k=>state.cells[k].shop=sh.id); made++;
  }
  if(made)save(); return made;
}
function pruneUnusedUnnamedShops(){ const used=new Set(Object.values(state.cells).map(d=>d.shop).filter(Boolean)),removed=new Set();
  state.shops=state.shops.filter(sh=>{const drop=String(sh.name||"").startsWith("未命名")&&!used.has(sh.id);if(drop)removed.add(sh.id);return !drop;});
  if(removed.has(state.lastShopId)){state.lastShopId="";lastShopName="";}
}
let toastTimer=null;
function toast(msg){ const el=$("#toast"); el.textContent=msg; el.classList.add("on"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove("on"),2200); }

/* ---- canvas ---- */
const base=$("#base"), overlay=$("#overlay"), bctx=base.getContext("2d"), octx=overlay.getContext("2d");
base.width=overlay.width=imgW; base.height=overlay.height=imgH;
const CW=imgW/GRID_W, CH=imgH/GRID_H;

/* ---- transform (pan/zoom) ---- */
let baseW=0, baseH=0, tx=0, ty=0, s=1;
function fitBase(){ const wrap=$("#stagewrap"); baseW=wrap.clientWidth; baseH=baseW*imgH/imgW;
  $("#cstage").style.width=baseW+"px"; $("#cstage").style.height=baseH+"px"; }
function applyT(){ $("#cstage").style.transform=`translate(${tx}px,${ty}px) scale(${s})`; }
function clampT(){ const wrap=$("#stagewrap"); const W=wrap.clientWidth,H=wrap.clientHeight;
  const cwd=baseW*s, chd=baseH*s; const pad=60;
  tx=cwd<=W? clamp(tx,-pad,W-cwd+pad) : clamp(tx, W-cwd-pad, pad);
  ty=chd<=H? clamp(ty,-pad,H-chd+pad) : clamp(ty, H-chd-pad, pad);
}
function fit(){ fitBase(); s=1; tx=0; ty=($("#stagewrap").clientHeight-baseH)/2; clampT(); applyT(); }
function zoomAt(cx,cy,ns){ ns=clamp(ns,0.4,16); const wrap=$("#stagewrap").getBoundingClientRect();
  const px=cx-wrap.left, py=cy-wrap.top; const contentX=(px-tx)/s, contentY=(py-ty)/s;
  s=ns; tx=px-contentX*s; ty=py-contentY*s; clampT(); applyT(); }
$("#zoomIn").onclick=()=>{const w=$("#stagewrap").getBoundingClientRect();zoomAt(w.left+w.width/2,w.top+w.height/2,s*1.5);};
$("#zoomOut").onclick=()=>{const w=$("#stagewrap").getBoundingClientRect();zoomAt(w.left+w.width/2,w.top+w.height/2,s/1.5);};
$("#btnFit").onclick=fit;

/* ---- pointer -> cell ---- */
function cellAt(clientX,clientY){ const rect=overlay.getBoundingClientRect();
  const x=(clientX-rect.left)*(imgW/rect.width), y=(clientY-rect.top)*(imgH/rect.height);
  return clamp(Math.floor(y/CH),0,GRID_H-1)+"_"+clamp(Math.floor(x/CW),0,GRID_W-1); }

/* ---- gestures ---- */
const wrap=$("#stagewrap"); const pts=new Map();
let gest=null; // 'pan'|'select'|'pinch'
let selStart=null, selRect=null, moved=false, panLast=null, pinch=null;
wrap.addEventListener("pointerdown",e=>{
  if(e.target.closest(".zoomstack,.fab-col,.selbar,.targetbar")) return;
  wrap.setPointerCapture(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===2){ gest="pinch"; const p=[...pts.values()]; pinch={d:dist(p[0],p[1]),mx:(p[0].x+p[1].x)/2,my:(p[0].y+p[1].y)/2}; selRect=null; drawOverlay(); return; }
  moved=false;
  if(mode==="view"){ gest="pan"; panLast={x:e.clientX,y:e.clientY}; }
  else { gest="select"; selStart=cellAt(e.clientX,e.clientY); selRect=null; }
});
wrap.addEventListener("pointermove",e=>{
  if(!pts.has(e.pointerId))return; pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(gest==="pinch" && pts.size>=2){ const p=[...pts.values()]; const nd=dist(p[0],p[1]); const nmx=(p[0].x+p[1].x)/2,nmy=(p[0].y+p[1].y)/2;
    const wr=wrap.getBoundingClientRect(); const cX=(pinch.mx-wr.left-tx)/s, cY=(pinch.my-wr.top-ty)/s;
    s=clamp(s*(nd/pinch.d),0.4,16); tx=(nmx-wr.left)-cX*s; ty=(nmy-wr.top)-cY*s; clampT(); applyT();
    pinch={d:nd,mx:nmx,my:nmy}; return; }
  if(gest==="pan"){ tx+=e.clientX-panLast.x; ty+=e.clientY-panLast.y; panLast={x:e.clientX,y:e.clientY}; clampT(); applyT(); return; }
  if(gest==="select"){ const k=cellAt(e.clientX,e.clientY); if(k!==selStart) moved=true;
    const [r0,c0]=keyRC(selStart),[r1,c1]=keyRC(k); selRect=[Math.min(r0,r1),Math.min(c0,c1),Math.max(r0,r1),Math.max(c0,c1)]; drawOverlay(); }
});
function endPtr(e){ pts.delete(e.pointerId);
  if(gest==="pinch"){ if(pts.size<2){ gest=null; } return; }
  if(gest==="select"){
    if(!moved){ tapCell(selStart); }
    else if(selRect){ const [r0,c0,r1,c1]=selRect; for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++) addSelOrShop(r+"_"+c); afterSel(); }
    selRect=null; drawOverlay();
  }
  gest=null; selStart=null; panLast=null;
}
wrap.addEventListener("pointerup",endPtr); wrap.addEventListener("pointercancel",endPtr);
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}

function tapCell(k){
  if(mode==="view"){ openCellSheet(k); return; }
  addSelOrShop(k,true); afterSel();
}
function addSelOrShop(k,toggle){
  if(isFixedWall(k)){if(toggle)toast("牆壁為固定區域，不能標註");return;}
  if(activeShop){ const cur=state.cells[k]||{}; const sh=shopById(activeShop);
    if(cur.shop===activeShop){ delete cur.shop; if(!cur.cat)delete cur.cat; }
    else { cur.shop=activeShop; cur.cat=sh.cat; }
    if(cur.plan||cur.cat||cur.shop) state.cells[k]=cur; else delete state.cells[k];
    save();
  } else {
    if(toggle && selection.has(k)) selection.delete(k); else selection.add(k);
  }
}
function afterSel(){ if(activeShop){ recompute(); drawBase(); drawOverlay(); renderList(); } else { updateSelBar(); drawOverlay(); } }

/* ---- drawing ---- */
function drawBase(){ bctx.clearRect(0,0,imgW,imgH); bctx.fillStyle="#f5f7f7"; bctx.fillRect(0,0,imgW,imgH);
  const op=state.view==="plan"?0.95:0.30;
  for(const k in state.cells){ const d=state.cells[k]; if(!d.plan)continue; const z=zoneById(d.plan); if(!z)continue;
    const [r,c]=keyRC(k); bctx.fillStyle=hexA(z.color,d.plan==="zw"?1:op); bctx.fillRect(c*CW,r*CH,CW+0.6,CH+0.6); } }

function drawWalls(ctx){ const color=zoneById("zw")?.color||"#3B3838";
  for(const k in state.cells){ if(state.cells[k].plan!=="zw")continue; const [r,c]=keyRC(k); ctx.fillStyle=color; ctx.fillRect(c*CW,r*CH,CW+0.6,CH+0.6); } }

function drawOverlay(){
  octx.clearRect(0,0,imgW,imgH); const a=state.fillA/100;
  if(state.view==="actual"){
    for(const k in state.cells){ const d=state.cells[k]; if(!d.cat)continue; const c=catById(d.cat); if(!c)continue;
      const [r,cc]=keyRC(k); octx.fillStyle=hexA(c.color,a); octx.fillRect(cc*CW,r*CH,CW+0.6,CH+0.6); }
    drawWalls(octx);
    drawShopBorders(octx); drawLabels(octx);
  }
  if(state.showGrid){ octx.lineWidth=Math.max(0.4,CW*0.04); octx.strokeStyle="rgba(20,50,55,.13)"; octx.beginPath();
    for(let c=0;c<=GRID_W;c++){octx.moveTo(c*CW,0);octx.lineTo(c*CW,imgH);} for(let r=0;r<=GRID_H;r++){octx.moveTo(0,r*CH);octx.lineTo(imgW,r*CH);} octx.stroke(); }
  // selection
  if(selection.size){ octx.fillStyle=hexA("#e2603f",.35); octx.strokeStyle="#b5401f"; octx.lineWidth=CW*0.12;
    selection.forEach(k=>{const [r,c]=keyRC(k); octx.fillRect(c*CW,r*CH,CW,CH);}); }
  if(selRect){ const [r0,c0,r1,c1]=selRect; octx.strokeStyle="#b5401f"; octx.lineWidth=CW*0.14;
    octx.strokeRect(c0*CW,r0*CH,(c1-c0+1)*CW,(r1-r0+1)*CH); octx.fillStyle=hexA("#e2603f",.2); octx.fillRect(c0*CW,r0*CH,(c1-c0+1)*CW,(r1-r0+1)*CH); }
  // active shop glow
  if(activeShop){ octx.strokeStyle="#e2603f"; octx.lineWidth=CW*0.22; octx.setLineDash([CW*0.6,CW*0.4]);
    for(const k in state.cells){ if(state.cells[k].shop===activeShop){ const [r,c]=keyRC(k); octx.strokeRect(c*CW+1,r*CH+1,CW-2,CH-2);} } octx.setLineDash([]); }
}
function drawShopBorders(ctx){ ctx.strokeStyle="rgba(20,45,50,.55)"; ctx.lineWidth=Math.max(0.8,CW*0.12);
  for(const k in state.cells){ const d=state.cells[k]; if(!d.shop)continue; const [r,c]=keyRC(k);
    const nb=[[r-1,c,0],[r+1,c,1],[r,c-1,2],[r,c+1,3]];
    nb.forEach(([nr,nc,side])=>{ const nd=state.cells[nr+"_"+nc]; if(nd&&nd.shop===d.shop)return;
      ctx.beginPath();
      if(side===0){ctx.moveTo(c*CW,r*CH);ctx.lineTo((c+1)*CW,r*CH);}
      else if(side===1){ctx.moveTo(c*CW,(r+1)*CH);ctx.lineTo((c+1)*CW,(r+1)*CH);}
      else if(side===2){ctx.moveTo(c*CW,r*CH);ctx.lineTo(c*CW,(r+1)*CH);}
      else {ctx.moveTo((c+1)*CW,r*CH);ctx.lineTo((c+1)*CW,(r+1)*CH);}
      ctx.stroke(); }); } }
function shopAnchor(id){ let best=null; for(const k in state.cells){ if(state.cells[k].shop===id){ const [r,c]=keyRC(k);
    if(!best||r<best[0]||(r===best[0]&&c<best[1])) best=[r,c]; } } return best; }
function shopComponents(id){
  const pending=new Set(); for(const k in state.cells)if(state.cells[k].shop===id)pending.add(k);
  const out=[];
  while(pending.size){ const first=pending.values().next().value, q=[first], cells=[]; pending.delete(first);
    while(q.length){ const k=q.pop(),[r,c]=keyRC(k); cells.push([r,c]);
      [[r-1,c],[r+1,c],[r,c-1],[r,c+1]].forEach(([nr,nc])=>{const nk=nr+"_"+nc;if(pending.delete(nk))q.push(nk);}); }
    out.push(cells);
  }

}
function componentAnchor(cells){
  const center=cells.reduce((a,p)=>[a[0]+p[0],a[1]+p[1]],[0,0]).map(v=>v/cells.length);
  return cells.reduce((best,p)=>{const d=(p[0]-center[0])**2+(p[1]-center[1])**2;return !best||d<best.d?{p,d}:best;},null).p;
}
function shopLabelAnchors(id){return shopComponents(id).map(componentAnchor);}
function shopCentroid(id){ let sr=0,sc=0,n=0; for(const k in state.cells){ if(state.cells[k].shop===id){ const [r,c]=keyRC(k); sr+=r;sc+=c;n++; } }
  return n?[sr/n,sc/n,n]:null; }
function shopSortMetrics(id){let firstOpenX=Infinity,minY=Infinity,minX=Infinity,sumX=0,sumY=0,n=0;
  for(const k in state.cells){if(state.cells[k].shop!==id)continue;const [y,x]=keyRC(k);let left=x-1;
    while(left>=0&&(state.cells[y+"_"+left]||{}).shop)left--;
    firstOpenX=Math.min(firstOpenX,left);minY=Math.min(minY,y);minX=Math.min(minX,x);sumX+=x;sumY+=y;n++;}
  return n?{firstOpenX,minY,minX,averageScore:sumX/n+1.01*(sumY/n)}:null;}
function drawLabels(ctx){
  if(!state.showLabels && !state.showNames) return;
  state.shops.forEach(sh=>{ const num=numbers[sh.id];
    shopLabelAnchors(sh.id).forEach(anchor=>{ const cx=(anchor[1]+0.5)*CW, cy=(anchor[0]+0.5)*CH;
      if(state.showLabels && num){ const rr=CH*0.7; ctx.fillStyle="#0e3b43"; ctx.beginPath(); ctx.arc(cx,cy,rr,0,7); ctx.fill();
        ctx.fillStyle="#fff"; ctx.font="700 "+(CH*0.85)+"px 'Noto Sans TC',sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(num,cx,cy+CH*0.03); }
      if(state.showNames){ ctx.fillStyle="#10312f"; ctx.font="600 "+(CH*0.75)+"px 'Noto Sans TC',sans-serif"; ctx.textAlign="center"; ctx.textBaseline="top";
        ctx.fillText(sh.name, cx, cy+CH*0.8, 8*CW); }
    });
  });

/* ---- numbering: left-side opening x, occupied min y, occupied min x, then average x + 1.01y ---- */
function recompute(){
  const arr=state.shops.map(sh=>{const metrics=shopSortMetrics(sh.id);return metrics?{id:sh.id,...metrics}:null;}).filter(Boolean);
  arr.sort((p,q)=>p.firstOpenX-q.firstOpenX||p.minY-q.minY||p.minX-q.minX||p.averageScore-q.averageScore||p.id.localeCompare(q.id));
  numbers={}; arr.forEach((x,i)=>numbers[x.id]=i+1);
}

  exportOrderedShops().forEach(sh=>{ const cat=catById(sh.cat),a=shopAnchor(sh.id); rows.push([{t:'n',v:numbers[sh.id]},{t:'s',v:sh.name},{t:'s',v:cat?cat.name:''},{t:'n',v:shopCount(sh.id)},
    {t:'n',v:shopComponents(sh.id).length},{t:'s',v:a?`第 ${a[0]+1} 列／第 ${a[1]+1} 欄`:''}]); }); return rows; }
function exportXlsxBytes(){return buildXlsx("店家對照表",exportRows());}
function canvasBytes(cv,type,quality){return new Promise((resolve,reject)=>cv.toBlob(async b=>b?resolve(new Uint8Array(await b.arrayBuffer())):reject(new Error("canvas export failed")),type,quality));}
function syncExportOptions(){ const mode=document.querySelector('input[name="expMode"]:checked')?.value||"overlay",plan=mode==="plan",omit=$("#expNoLabels").checked,check=$("#expIncludeList"),disabled=plan||omit;check.disabled=disabled;if(disabled)check.checked=false;$("#expListLabel").classList.toggle("disabled",disabled);$("#expBaseOpacityWrap").classList.toggle("hidden",mode==="actual");$("#expActualOpacityWrap").classList.toggle("hidden",plan);$("#expBaseOpacityTitle").textContent=plan?"規劃層透明度":"底圖透明度";$("#expBaseOpacityValue").textContent=$("#expBaseOpacity").value+"%";$("#fillAValue").textContent=state.fillA+"%"; }
document.querySelectorAll('input[name="expMode"]').forEach(r=>r.onchange=syncExportOptions);
$("#expNoLabels").onchange=syncExportOptions;
$("#expBaseOpacity").oninput=syncExportOptions;
async function exportImage(format){ const buttons=[...$("#expSheet").querySelectorAll("button")];buttons.forEach(b=>b.disabled=true);toast("正在建立 "+format.toUpperCase()+"…");
  try{const opts=getExportOptions(),layout=exportLayout(opts);let data,type;if(format==="svg"){data=sb(buildSVG(opts));type="image/svg+xml";}else{const sc=exportScaleFor(layout),cv=document.createElement("canvas");cv.width=Math.round(layout.width*sc);cv.height=Math.round(layout.totalH*sc);renderComposite(cv.getContext("2d"),sc,opts);
      if(format==="png"){data=await canvasBytes(cv,"image/png");type="image/png";}else{const jpeg=dataURLtoU8(cv.toDataURL("image/jpeg",.94));data=buildPdf(jpeg,cv.width,cv.height);type="application/pdf";}}
    dl(new Blob([data],{type}),"市場店家圖-"+stamp()+"."+format);toast("已匯出 "+format.toUpperCase());
  }catch(e){console.error(e);toast("匯出失敗，請再試一次");}finally{buttons.forEach(b=>b.disabled=false);syncExportOptions();} }
$("#expPNG").onclick=()=>exportImage("png");
$("#expPDF").onclick=()=>exportImage("pdf");
$("#expSVG").onclick=()=>exportImage("svg");
$("#expXLSX").onclick=()=>{ const x=exportXlsxBytes(); dl(new Blob([x],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}),"店家對照表-"+stamp()+".xlsx"); toast("已匯出 Excel 對照表"); };

function wrapSvgText(text,maxChars,maxLines=2){const chars=Array.from(String(text||"")),lines=[];for(let i=0;i<chars.length&&lines.length<maxLines;i+=maxChars)lines.push(chars.slice(i,i+maxChars).join(""));if(lines.join("").length<chars.length&&lines.length)lines[lines.length-1]=lines[lines.length-1].slice(0,-1)+"…";return lines.length?lines:[""];}
function buildSVG(opts={}){ const layout=exportLayout(opts);let r=`<svg xmlns="http://www.w3.org/2000/svg" width="${layout.width}" height="${layout.totalH}" viewBox="0 0 ${layout.width} ${layout.totalH}" font-family="'Noto Sans TC',sans-serif"><rect width="${layout.width}" height="${layout.totalH}" fill="#fff"/><g transform="translate(${layout.padX} ${layout.padY})">`;
  if(layout.mode==="plan"||layout.mode==="overlay")for(const k in state.cells){const d=state.cells[k];if(!d.plan)continue;const z=zoneById(d.plan);if(!z)continue;const [rr,c]=keyRC(k),opacity=d.plan==="zw"?1:layout.baseOpacity/100;r+=`<rect x="${(c*CW).toFixed(1)}" y="${(rr*CH).toFixed(1)}" width="${CW.toFixed(1)}" height="${CH.toFixed(1)}" fill="${z.color}" fill-opacity="${opacity}"/>`;}
  if(layout.mode!=="plan"){const a=state.fillA/100;for(const k in state.cells){const d=state.cells[k];if(!d.cat)continue;const cat=catById(d.cat);if(!cat)continue;const [rr,c]=keyRC(k);r+=`<rect x="${(c*CW).toFixed(1)}" y="${(rr*CH).toFixed(1)}" width="${CW.toFixed(1)}" height="${CH.toFixed(1)}" fill="${cat.color}" fill-opacity="${a}"/>`;}}
  const wallColor=zoneById("zw")?.color||"#3B3838";for(const k in state.cells){if(state.cells[k].plan!=="zw")continue;const [rr,c]=keyRC(k);r+=`<rect class="wall" x="${(c*CW).toFixed(1)}" y="${(rr*CH).toFixed(1)}" width="${CW.toFixed(1)}" height="${CH.toFixed(1)}" fill="${wallColor}"/>`;}
  if(layout.mode!=="plan")for(const k in state.cells){const d=state.cells[k];if(!d.shop)continue;const [rr,c]=keyRC(k),seg=[];if((state.cells[(rr-1)+"_"+c]||{}).shop!==d.shop)seg.push([c*CW,rr*CH,(c+1)*CW,rr*CH]);if((state.cells[(rr+1)+"_"+c]||{}).shop!==d.shop)seg.push([c*CW,(rr+1)*CH,(c+1)*CW,(rr+1)*CH]);if((state.cells[rr+"_"+(c-1)]||{}).shop!==d.shop)seg.push([c*CW,rr*CH,c*CW,(rr+1)*CH]);if((state.cells[rr+"_"+(c+1)]||{}).shop!==d.shop)seg.push([(c+1)*CW,rr*CH,(c+1)*CW,(rr+1)*CH]);seg.forEach(g=>r+=`<line x1="${g[0].toFixed(1)}" y1="${g[1].toFixed(1)}" x2="${g[2].toFixed(1)}" y2="${g[3].toFixed(1)}" stroke="#142d32" stroke-opacity=".55" stroke-width="${(CW*.12).toFixed(1)}"/>`);}
  if(state.showGrid){r+=`<g stroke="#143237" stroke-opacity=".13" stroke-width="0.5">`;for(let c=0;c<=GRID_W;c++)r+=`<line x1="${(c*CW).toFixed(1)}" y1="0" x2="${(c*CW).toFixed(1)}" y2="${imgH}"/>`;for(let rr=0;rr<=GRID_H;rr++)r+=`<line x1="0" y1="${(rr*CH).toFixed(1)}" x2="${imgW}" y2="${(rr*CH).toFixed(1)}"/>`;r+=`</g>`;}
  if(layout.mode!=="plan"&&!layout.omitShopLabels)layout.shops.forEach(sh=>{const num=numbers[sh.id];shopLabelAnchors(sh.id).forEach(anchor=>{const cx=(anchor[1]+.5)*CW,cy=(anchor[0]+.5)*CH;r+=`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${(CH*.75).toFixed(1)}" fill="#0e3b43"/><text x="${cx.toFixed(1)}" y="${cy.toFixed(1)}" fill="#fff" font-size="${(CH*.9).toFixed(1)}" font-weight="700" text-anchor="middle" dominant-baseline="central">${num}</text>`;});});
  r+=`</g>`;
  const ly=layout.mapH,colW=(layout.width-72)/EXPORT_COLS;r+=`<rect x="0" y="${ly}" width="${layout.width}" height="${layout.legendH}" fill="#fff"/><line x1="0" y1="${ly}" x2="${layout.width}" y2="${ly}" stroke="#cad4d5"/><text x="36" y="${ly+40}" fill="#0e3b43" font-size="27" font-weight="700">顏色圖例｜${layout.mode==="plan"?"原先規劃":"實際分類"}</text>`;
  layout.legendItems.forEach((item,i)=>{const col=i%EXPORT_COLS,row=Math.floor(i/EXPORT_COLS),x=36+col*colW,y=ly+83+row*48;r+=`<rect x="${x.toFixed(1)}" y="${(y-21).toFixed(1)}" width="29" height="29" rx="4" fill="${item.color}" stroke="#000" stroke-opacity=".22"/><text x="${(x+41).toFixed(1)}" y="${(y+2).toFixed(1)}" fill="#203236" font-size="21" font-weight="600">${xesc(item.name)}</text>`;});
  if(layout.includeList){const top=layout.mapH+layout.legendH,pad=32,listColW=(layout.width-pad*2)/EXPORT_COLS;r+=`<rect x="0" y="${top}" width="${layout.width}" height="${layout.listH}" fill="#f7f9f9"/><line x1="0" y1="${top}" x2="${layout.width}" y2="${top}" stroke="#cad4d5"/><text x="${pad}" y="${top+45}" fill="#0e3b43" font-size="34" font-weight="700">店家對照</text>`;
    if(!layout.shops.length)r+=`<text x="${pad}" y="${top+94}" fill="#627579" font-size="22">尚無店家資料</text>`;
    for(let col=0;col<EXPORT_COLS;col++){let y=top+67,cellX=pad+col*listColW;layout.listColumns[col].forEach(entry=>{const {sh,lines,height}=entry,x=cellX+9,num=numbers[sh.id],cat=catById(sh.cat),nameY=y+(lines.length>1?22:25),catY=y+(lines.length>1?79:52);r+=`<rect x="${cellX.toFixed(1)}" y="${y}" width="${listColW.toFixed(1)}" height="${height}" fill="${cat?.color||"#D9DEE0"}" fill-opacity=".14" stroke="#5a6e72" stroke-opacity=".24"/><circle cx="${(x+20).toFixed(1)}" cy="${(y+height/2).toFixed(1)}" r="20" fill="#0e3b43"/><text x="${(x+20).toFixed(1)}" y="${(y+height/2).toFixed(1)}" fill="#fff" font-size="19" font-weight="700" text-anchor="middle" dominant-baseline="central">${num}</text><text x="${(x+50).toFixed(1)}" y="${nameY}" fill="#1c2b2e" font-size="27" font-weight="600">${lines.map((line,i)=>`<tspan x="${(x+50).toFixed(1)}" y="${nameY+i*28}">${xesc(line)}</tspan>`).join("")}</text><text x="${(x+50).toFixed(1)}" y="${catY}" fill="#53676b" font-size="21">${xesc(cat?cat.name:"")}</text>`;y+=height;});}
  }
  return r+`</svg>`;
}
function dataURLtoU8(durl){ const b64=durl.split(",")[1]; const bin=atob(b64); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i); return u; }

/* ---- minimal xlsx + zip + pdf writers ---- */
function crc32(buf){ let crc=~0; for(let i=0;i<buf.length;i++){ crc^=buf[i]; for(let j=0;j<8;j++) crc=(crc>>>1)^(0xEDB88320 & -(crc&1)); } return ~crc>>>0; }
function sb(s){ return new TextEncoder().encode(s); }
function u16(n){return [n&255,(n>>8)&255];} function u32(n){return [n&255,(n>>8)&255,(n>>16)&255,(n>>24)&255];}
function buildZip(files){ let ch=[],cd=[],off=0;
  for(const f of files){ const nm=sb(f.name),dt=f.data,crc=crc32(dt);
    const l=[0x50,0x4b,3,4,...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(dt.length),...u32(dt.length),...u16(nm.length),...u16(0)];
    ch.push(new Uint8Array(l),nm,dt);
    const c=[0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(dt.length),...u32(dt.length),...u16(nm.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)];
    cd.push(new Uint8Array(c),nm); off+=l.length+nm.length+dt.length; }
  let cds=0; cd.forEach(x=>cds+=x.length);
  const e=[0x50,0x4b,5,6,...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cds),...u32(off),...u16(0)];
  const all=[...ch,...cd,new Uint8Array(e)]; let t=0; all.forEach(a=>t+=a.length); const o=new Uint8Array(t); let p=0; all.forEach(a=>{o.set(a,p);p+=a.length;}); return o; }
function xesc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function colName(i){let s='';i++;while(i>0){i--;s=String.fromCharCode(65+i%26)+s;i=Math.floor(i/26);}return s;}
function buildXlsx(sheetName,rows){ let sd='';
  rows.forEach((row,ri)=>{ let cs=''; row.forEach((cell,ci)=>{ if(cell==null||cell.v==null||cell.v==='')return; const ref=colName(ci)+(ri+1);
    if(cell.t==='n')cs+=`<c r="${ref}"><v>${cell.v}</v></c>`; else cs+=`<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xesc(cell.v)}</t></is></c>`; });
    sd+=`<row r="${ri+1}">${cs}</row>`; });
  const last=colName(Math.max(0,...rows.map(r=>r.length-1)))+Math.max(1,rows.length);
  const sx=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols><col min="1" max="1" width="9" customWidth="1"/><col min="2" max="2" width="28" customWidth="1"/><col min="3" max="3" width="20" customWidth="1"/><col min="4" max="5" width="13" customWidth="1"/><col min="6" max="6" width="22" customWidth="1"/></cols><sheetData>${sd}</sheetData><autoFilter ref="A1:${last}"/></worksheet>`;
  const wb=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="${xesc(sheetName)}" sheetId="1" r:id="rId1"/></sheets></workbook>`;
  const wr=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>`;
  const rl=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`;
  const ct=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>`;
  return buildZip([{name:'[Content_Types].xml',data:sb(ct)},{name:'_rels/.rels',data:sb(rl)},{name:'xl/workbook.xml',data:sb(wb)},{name:'xl/_rels/workbook.xml.rels',data:sb(wr)},{name:'xl/worksheets/sheet1.xml',data:sb(sx)}]);
}
function buildPdf(jpeg,w,h){ let parts=[],off=[],pos=0; const add=b=>{parts.push(b);pos+=b.length;};
  add(sb("%PDF-1.4\n"));
  function obj(n,body){ off[n]=pos; add(sb(n+" 0 obj\n"+body+"\nendobj\n")); }
  obj(1,"<< /Type /Catalog /Pages 2 0 R >>");
  obj(2,"<< /Type /Pages /Kids [3 0 R] /Count 1 >>");
  obj(3,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${w} ${h}] /Resources << /XObject << /Im0 5 0 R >> >> /Contents 4 0 R >>`);
  const content=`q ${w} 0 0 ${h} 0 0 cm /Im0 Do Q`;
  obj(4,`<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
  off[5]=pos; add(sb(`5 0 obj\n<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpeg.length} >>\nstream\n`)); add(jpeg); add(sb("\nendstream\nendobj\n"));
  const xref=pos; let x="xref\n0 6\n0000000000 65535 f \n"; for(let i=1;i<=5;i++)x+=String(off[i]).padStart(10,"0")+" 00000 n \n"; add(sb(x));
  add(sb(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`));
  let t=0; parts.forEach(p=>t+=p.length); const o=new Uint8Array(t); let p=0; parts.forEach(a=>{o.set(a,p);p+=a.length;}); return o; }

/* ---- import/export json ---- */
$("#btnExportJSON").onclick=()=>dl(new Blob([JSON.stringify(state)],{type:"application/json"}),"market-backup-"+stamp()+".json");
$("#btnImport").onclick=()=>$("#fileJson").click();
$("#fileJson").onchange=e=>{ const f=e.target.files[0]; if(!f)return; const rd=new FileReader();
  rd.onload=()=>{ try{ const st=JSON.parse(rd.result); if(!st.cells||!st.zones)throw 0; state=Object.assign({cats:[],shops:[],view:"actual",fillA:80,showGrid:true,showLabels:true,showNames:false,listCollapsed:false,lastShopId:"",taxonomyVersion:0},st); boot(); closeSheet("menuSheet"); }catch(_){ alert("無法讀取此檔。"); } };
  rd.readAsText(f); e.target.value=""; };

/* ---- boot ---- */
function load(){ try{ const raw=localStorage.getItem(LS_KEY); if(raw){ const st=JSON.parse(raw); if(st&&st.zones&&st.cells){ state=Object.assign(state,st); if(!Object.prototype.hasOwnProperty.call(st,"taxonomyVersion"))state.taxonomyVersion=0; return true; } } }catch(e){} return false; }
function boot(){ normalizeTaxonomy(); enforceFixedWalls(); ensureNamedRegions(); lastShopName=shopById(state.lastShopId)?.name||""; recompute(); syncListCollapse(); syncLegend(); syncExportOptions(); fit(); drawBase(); drawOverlay(); renderList(); setMode("assign"); setView(state.view||"actual"); }
if(!load()){ state.cells=clone(DEFAULT_PLAN_CELLS); }
window.addEventListener("resize",debounce(()=>{ fit(); if(activeShop)zoomToShop(activeShop); },200));
window.addEventListener("beforeunload",()=>{try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){}});
boot();
</script>
